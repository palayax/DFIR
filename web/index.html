<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRTriage Console — Cyber-to-Business Risk</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/business.css">
<link rel="stylesheet" href="assets/css/bia.css">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
<a class="skip-link" href="#app-main">Skip to main content</a>

<div id="app-shell">
  <header class="app-header">
    <div class="app-brand">
      <span class="app-brand-mark" aria-hidden="true">&#9670;</span>
      <span>IRTriage</span>
    </div>

    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <div class="engagement-picker">
      <label for="engagement-input" class="visually-hidden">Engagement</label>
      <input id="engagement-input" class="input" type="text" placeholder="Engagement" title="Engagement / case id (used in forensic exports)" autocomplete="off">
    </div>

    <div id="theme-toggle" class="theme-toggle" role="group" aria-label="Color theme">
      <button type="button" data-theme="auto" aria-pressed="false" title="Follow system theme" aria-label="Auto theme">◐</button>
      <button type="button" data-theme="light" aria-pressed="false" title="Light theme" aria-label="Light theme">☀</button>
      <button type="button" data-theme="dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme">☾</button>
    </div>
  </header>

  <main id="app-main" class="app-main" role="main" aria-live="polite"></main>

  <footer class="app-footer">
    Runs entirely in your browser. No files leave this device unless you explicitly export or configure remote storage in Settings.
    <span class="footer-tm">Product names and logos are trademarks of their respective owners, shown to illustrate a fictional company; no affiliation implied.</span>
  </footer>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
